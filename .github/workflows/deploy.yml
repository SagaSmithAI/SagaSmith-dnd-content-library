name: Deploy content library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate portable catalog
        run: python scripts/validate_catalog.py
      - uses: actions/checkout@v4
        with:
          repository: SagaSmithAI/sagasmith-dnd-ui
          path: ui
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Build UI
        working-directory: ui
        env:
          SAGASMITH_UI_BASE: /SagaSmith-dnd-content-library/ui
          SAGASMITH_UI_SITE: https://sagasmithai.github.io
          PUBLIC_SAGASMITH_LIBRARY_URL: /SagaSmith-dnd-content-library/content-library/index.json
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir site
          cp -R public/. site/
          cp -R ui/dist/. site/ui/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
