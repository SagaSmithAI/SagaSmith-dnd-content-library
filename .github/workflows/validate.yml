name: Validate private content library

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install regression test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Validate current Pack collection
        run: python scripts/validate_library.py
      - name: Validate committed long-regression evidence
        run: python scripts/validate_regression_evidence.py regression-evidence
      - name: Test long-regression tooling
        run: python -m pytest tests -q
